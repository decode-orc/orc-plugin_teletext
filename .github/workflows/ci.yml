name: CI and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ${{ matrix.os }}
    env:
      ORC_SDK_DIR: ${{ github.workspace }}/decode-orc
      # Host SDK the plugin is built against. Tracks `main` (host ABI 21).
      # Pin to a branch or tag only for a deliberate, temporary reason, and
      # restore `main` once it merges.
      ORC_SDK_REF: main
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every binary must carry the release orc-gui's toolchain tag, and
          # the view binary must be built against the view Qt baseline (see
          # decode-orc's plugin-sdk.md). Linux therefore builds inside
          # org.kde.Sdk//6.9, the SDK decode-orc's Flatpak is built with
          # (GCC 14, Qt 6.9): a Nix build (GCC 15) does not load there. macOS
          # (AppleClang 21 vs Nix clang 21) and Windows (MSVC) already match
          # their release orc-gui, and install Qt 6.9 for the view. spdlog and
          # fmt are compiled into the binaries header-only on every platform
          # (decode-orc's plugin-sdk.md, "Private spdlog and fmt"), so no
          # build links the build machine's copies; package_local.sh fails a
          # binary that does (decode-orc issue #391).
          - os: ubuntu-latest
            platform: linux
            use_nix: false
            use_kde_sdk: true
            build_dir: build-kde-sdk/plugin
          - os: macos-latest
            platform: macos
            use_nix: true
            build_dir: build
            qt_host: mac
            qt_arch: clang_64
          - os: windows-latest
            platform: windows
            use_nix: false
            build_dir: build
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout decode-orc host repository
        uses: actions/checkout@v4
        with:
          repository: decode-orc/decode-orc
          ref: ${{ env.ORC_SDK_REF }}
          path: decode-orc

      - name: Install Nix
        if: matrix.use_nix
        uses: cachix/install-nix-action@v31

      - name: Enforce SDK boundary
        shell: bash
        run: |
          chmod +x scripts/check_sdk_boundary.sh
          ./scripts/check_sdk_boundary.sh .

      - name: Install the Flatpak KDE SDK (Linux)
        if: matrix.use_kde_sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.9 org.kde.Sdk//6.9

      # Configure, build and run the unit, view and functional tests in one
      # go, inside the SDK (which has Qt 6.9). The functional tests skip: the
      # captures are not here.
      - name: Build and test (KDE SDK)
        if: matrix.use_kde_sdk
        run: |
          chmod +x scripts/build_in_kde_sdk.sh
          ./scripts/build_in_kde_sdk.sh "$ORC_SDK_DIR" build-kde-sdk

      # The view links Qt Widgets, built against the view Qt baseline (6.9):
      # orc-gui refuses a view built for a newer Qt minor than its own.
      - name: Install Qt (view baseline)
        if: matrix.qt_host
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}

      - name: Configure (Nix)
        if: matrix.use_nix
        shell: bash
        run: |
          args="-DCMAKE_BUILD_TYPE=Release -DORC_INTREE_SDK_DIR=$ORC_SDK_DIR -DBUILD_TESTS=ON"
          # Point CMake at the baseline Qt rather than the devshell's newer
          # one. Qt6_DIR alone is not enough: Qt's config finds its tool
          # packages through the prefix path, where the devshell's Qt would
          # otherwise come first and mix two Qt versions.
          if [ -n "${QT_ROOT_DIR:-}" ]; then
            args="$args -DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6 -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          fi
          nix develop --accept-flake-config --command bash -c \
            'export CMAKE_PREFIX_PATH="${QT_ROOT_DIR:+$QT_ROOT_DIR:}${CMAKE_PREFIX_PATH:-}"; cmake -S . -B build "$@"' \
            configure $args

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install fmt:x64-windows spdlog:x64-windows gtest:x64-windows

      - name: Configure (native)
        if: ${{ !matrix.use_nix && !matrix.use_kde_sdk }}
        run: >
          cmake -S . -B build
          -DORC_INTREE_SDK_DIR=${{ env.ORC_SDK_DIR }}
          -DBUILD_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DQt6_DIR=${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6

      - name: Build (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command cmake --build build --config Release --parallel

      - name: Build (native)
        if: ${{ !matrix.use_nix && !matrix.use_kde_sdk }}
        run: cmake --build build --config Release --parallel

      - name: Unit tests (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command ctest --test-dir build --output-on-failure -C Release -L unit

      - name: Unit tests (native)
        if: ${{ !matrix.use_nix && !matrix.use_kde_sdk }}
        run: ctest --test-dir build --output-on-failure -C Release -L unit

      - name: View tests (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command ctest --test-dir build --output-on-failure -C Release -L view

      - name: View tests (native)
        if: ${{ !matrix.use_nix && !matrix.use_kde_sdk }}
        run: ctest --test-dir build --output-on-failure -C Release -L view

      - name: Functional tests (Nix)
        if: matrix.use_nix
        run: nix develop --accept-flake-config --command ctest --test-dir build --output-on-failure -C Release -L functional

      - name: Functional tests (native)
        if: ${{ !matrix.use_nix && !matrix.use_kde_sdk }}
        run: ctest --test-dir build --output-on-failure -C Release -L functional

      # Names the asset orc-plugin_teletext_<platform>_abi<N>.<ext> and writes
      # dist/plugin-manifest-<platform>.yaml declaring its platform, host ABI,
      # toolchain tag and SHA-256: the facts the release manifest is built from.
      - name: Package artifact and manifest fragment
        shell: bash
        run: |
          chmod +x scripts/package_local.sh
          if [ "${{ matrix.use_kde_sdk }}" = "true" ]; then
            # orc-plugin-build-info was built against the SDK's glibc (2.40),
            # newer than the runner's, so package inside the SDK as well.
            mkdir -p dist
            flatpak run --filesystem="$PWD" --command=bash org.kde.Sdk//6.9 \
              "$PWD/scripts/package_local.sh" "$PWD/${{ matrix.build_dir }}" "$PWD/dist"
          else
            ./scripts/package_local.sh ${{ matrix.build_dir }} dist
          fi

      # The real merge only runs on tag builds, so exercise the script on
      # every platform here: a fragment-format or portability regression then
      # fails the PR rather than the release.
      - name: Check manifest fragment merges
        shell: bash
        run: |
          chmod +x scripts/merge_manifests.sh
          ./scripts/merge_manifests.sh \
            "${RUNNER_TEMP}/orc-plugin-manifest.yaml" \
            dist/plugin-manifest-${{ matrix.platform }}.yaml

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*

  # The flake's own package: builds against the decode-orc revision pinned in
  # flake.lock and runs the unit tests in its check phase.
  nix-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build the flake package
        run: nix build --accept-flake-config -L .#default

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A release without a valid orc-plugin-manifest.yaml cannot be browsed,
      # installed or updated to, so a failed merge must fail the release
      # rather than publish binaries nobody can use.
      - name: Build release manifest
        run: |
          chmod +x scripts/merge_manifests.sh
          ./scripts/merge_manifests.sh orc-plugin-manifest.yaml \
            artifacts/*/plugin-manifest-*.yaml

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/orc-plugin_teletext_*
            artifacts/**/orc-view_teletext_*
            orc-plugin-manifest.yaml
